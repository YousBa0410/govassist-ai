version: "3.9"

services:
  backend:
    build: ./backend
    container_name: gov-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
    env_file:
      - ./.env

  frontend:
    build: ./frontend
    container_name: gov-frontend
    ports:
      - "3000:3000"
    env_file:
      - ./.env
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules



